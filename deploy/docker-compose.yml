# ===========================================================================
# 课程安全靶场 · Docker Compose 编排（框架阶段）
# 拓扑：公网 → web(Nginx) → backend(Node) → db(MySQL，不暴露公网)
#
# 使用方式（在仓库根目录执行）：
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d
# 说明：
#   * 所有密码/密钥来自 .env（模板见 .env.example），仓库中不保存真实值
#   * db 只在 internal 网络内可见，不映射任何宿主机端口
#   * 上传目录与日志使用命名卷持久化
# ===========================================================================
name: course-sec-lab

services:
  db:
    image: mysql:8.4.4
    container_name: csl-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?请在 .env 中设置 DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-course_sec_lab}
      MYSQL_USER: ${DB_USER:-lab_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    # 注意：不配置 ports，数据库不对公网/宿主机暴露
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    image: course-sec-lab/backend:0.1.0
    container_name: csl-backend
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      NODE_ENV: production
      PORT: '3000'
      DB_DRIVER: mysql
      DB_HOST: db
      DB_PORT: '3306'
      DB_NAME: ${DB_NAME:-course_sec_lab}
      DB_USER: ${DB_USER:-lab_user}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      TRUST_PROXY: '1'
      LOG_TO_FILE: 'true'
      LOG_DIR: /app/logs
      UPLOAD_DIR: /app/uploads
      TZ: UTC
    expose:
      - '3000'
    volumes:
      - upload_data:/app/uploads
      - app_logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_net
      - internal
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    image: course-sec-lab/web:0.1.0
    container_name: csl-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - '${PUBLIC_HTTP_PORT:-80}:80'
    networks:
      - app_net
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  db_data:
  upload_data:
  app_logs:

networks:
  # 面向公网的一层：只有 web 与 backend
  app_net:
    driver: bridge
  # 数据面：internal=true 表示该网络无外网出口，db 只在这里
  internal:
    driver: bridge
    internal: true
