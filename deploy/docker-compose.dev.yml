# ===========================================================================
# 仅本地开发使用的 Compose 覆盖文件（叠加在 docker-compose.yml 之上）
#
# 用途：把 MySQL 映射到 127.0.0.1:3306，让“宿主机上 npm run dev 的后端”
#       能连接 Docker 里的数据库，方便本地迁移/种子/调试。
#
# 用法：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml \
#     --env-file .env up -d db
#
# 安全约束：
#   * 只绑定 127.0.0.1，不对公网/局域网暴露
#   * 生产部署禁止使用本文件（生产编排中 db 不映射任何宿主机端口）
#   * 端口冲突时在 .env 设置 DB_PUBLISH_PORT（如 3307）
# ===========================================================================
services:
  db:
    ports:
      - '127.0.0.1:${DB_PUBLISH_PORT:-3306}:3306'
